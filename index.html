<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE BUNKER — Room 1: Water</title>
<meta name="description" content="THE BUNKER: a free emergency-preparedness game in English and Haitian Creole. Room 1: safe water.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1214; --panel:#171c1f; --panel2:#1f262a; --line:#2c353a;
  --text:#e9ece8; --muted:#9aa5a3; --amber:#f2a93b; --water:#4fb3d9;
  --good:#5cc489; --bad:#e8604c; --mid:#c9b458;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:
  repeating-linear-gradient(90deg,transparent 0 59px,rgba(255,255,255,.018) 59px 60px),
  repeating-linear-gradient(0deg,transparent 0 59px,rgba(255,255,255,.018) 59px 60px),var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-family:Oswald,sans-serif;font-weight:700;letter-spacing:.12em;font-size:18px}
.brand span{color:var(--amber)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);font:600 12px Inter;padding:7px 12px;cursor:pointer}
.lang button.on{background:var(--amber);color:#1a1205}
.progress{display:flex;gap:6px;margin-bottom:16px}
.progress div{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress div.done{background:var(--water)}
.progress div.now{background:var(--amber)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.stage{font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
h1{font-family:Oswald,sans-serif;font-size:30px;line-height:1.1;margin-bottom:10px;letter-spacing:.02em}
h2{font-family:Oswald,sans-serif;font-size:22px;line-height:1.2;margin-bottom:10px}
p{color:var(--muted);line-height:1.5;font-size:15px}
p+p{margin-top:8px}
.hero{font-size:64px;text-align:center;margin:8px 0 14px}
.btn{display:block;width:100%;margin-top:16px;background:var(--amber);color:#1a1205;border:0;border-radius:10px;padding:14px;font:700 16px Inter;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
.btn:active{transform:scale(.99)}
.item{display:flex;align-items:center;gap:14px;background:var(--panel2);border-radius:12px;padding:16px;margin:12px 0}
.item .em{font-size:40px}
.item .nm{font-weight:700;font-size:17px;line-height:1.3}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bin{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px 4px;font:600 13px Inter;cursor:pointer;text-align:center}
.bin b{display:block;font-size:22px;margin-bottom:4px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:13px 14px;font:500 15px Inter;cursor:pointer;line-height:1.35}
.opt.right,.bin.right{border-color:var(--good);background:rgba(92,196,137,.12)}
.opt.wrong,.bin.wrong{border-color:var(--bad);background:rgba(232,96,76,.12)}
.opt:disabled,.bin:disabled{cursor:default}
.fb{margin-top:14px;border-left:3px solid var(--good);padding:10px 12px;background:rgba(92,196,137,.07);border-radius:0 8px 8px 0}
.fb.no{border-color:var(--bad);background:rgba(232,96,76,.07)}
.fb strong{display:block;margin-bottom:4px}
.fb p{color:var(--text);font-size:14px}
.scene{background:linear-gradient(135deg,#1d2a33,#14191c);border:1px solid #2b4250;border-radius:12px;padding:14px;margin-bottom:12px}
.scene .tag{font:700 11px Inter;letter-spacing:.12em;color:var(--water);text-transform:uppercase}
.scene p{color:var(--text);margin-top:4px}
.count{font:600 12px Inter;color:var(--muted);margin-bottom:4px}
.score{text-align:center;margin:6px 0 16px}
.score .big{font-family:Oswald,sans-serif;font-size:64px;line-height:1}
.score .big small{font-size:24px;color:var(--muted)}
.bar{margin:12px 0}
.bar .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.bar .track{height:9px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;border-radius:5px;transition:width .8s}
.badge{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:999px;font:700 13px Inter}
ul.check{list-style:none;margin-top:10px}
ul.check li{padding:9px 0 9px 30px;position:relative;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
ul.check li:before{content:"☐";position:absolute;left:4px;top:8px;color:var(--water);font-size:16px}
.src{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.6}
.src a{color:var(--water)}
.note{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
</style>
</head>

  <header>
    <div class="brand">THE <span>BUNKER</span></div>

const ITEMS=[
 {e:"💧",b:"u",en:["Sealed store-bought bottled water","Unopened commercial water is the safest water to store. Keep it sealed until you need it."],

  ht:["Boutèy kola 2 lit ki pwòp","Si w ap reitilize boutèy, FEMA di boutèy kola se bon chwa a. Lave yo epi dezenfekte yo anvan."]},
 {e:"🪣",b:"a",en:["Bucket that held paint or chemicals","You can't clean out chemicals well enough to make the bucket safe for drinking water."],
  ht:["Bokit ki te gen penti oswa pwodui chimik","Ou pa ka netwaye pwodui chimik yo ase pou bokit la vin san danje pou dlo pou bwè."]},
 {e:"🧴",b:"u",en:["Plain, unscented bleach (6–8.25%)","Regular bleach makes doubtful water safe to drink. Check the label: sodium hypochlorite should be the only active ingredient."],

 {e:"💉",b:"u",en:["Eyedropper","You measure bleach in drops. A dropper keeps the dose accurate."],
  ht:["Konngout","Klowòks la mezire an gout. Yon konngout ede w mete bon kantite a."]},
 {e:"🍲",b:"u",en:["Pot and a safe way to heat it","Boiling is the surest way to kill germs. Never run a gas stove or grill inside a closed space."],
  ht:["Chodyè ak yon fason san danje pou chofe l","Bouyi dlo se fason ki pi sèten pou touye mikwòb. Pa janm sèvi ak recho gaz oswa griy anndan yon kote ki fèmen."]},

const STORE=[

 {en:{q:"What should you write on each container?",o:["Nothing","Your name","“DRINKING WATER” and the date you filled it","The brand of the container"],x:"A label stops mix-ups and tells you when it's time to rotate the water."},

const CALC=[
 {en:{q:"Minimum water: 1 gallon per person per day. How much does a family of 5 need for 30 days?",o:["30 gallons","75 gallons","150 gallons","300 gallons"],x:"5 people × 1 gallon × 30 days = 150 gallons. About half is for drinking, the rest for cooking and hygiene."},

];
const EMERG=[
 {sc:true,en:{q:"Hurricane passed. Your stored water is low and the tap water comes out brown and cloudy. Officials issued a boil-water notice. What do you do FIRST?",o:["Drink it quickly before it gets worse","Let it settle, then filter it through a clean cloth","Add bleach right away without filtering","Wait until it looks clear, then drink it"],x:"Germ killers don't work well in cloudy water. Let it settle and filter it before you treat it. Clear-looking water can still carry germs."},
  ht:{q:"Siklòn nan pase. Dlo ou te sere a prèske fini, epi dlo tiyo a soti mawon e twoub. Otorite yo bay yon avi pou bouyi dlo. Kisa ou fè AN PREMYE?",o:["Bwè l vit anvan li vin pi mal","Kite l repoze, epi filtre l nan yon twal pwòp","Mete klowòks touswit san filtre","Tann li sanble klè epi bwè l"],x:"Bagay ki touye mikwòb yo pa mache byen nan dlo twoub. Kite l repoze epi filtre l anvan ou trete l. Dlo ki sanble klè ka gen mikwòb toujou."},a:1},
 {en:{q:"You can boil it. How long?",o:["Until the first bubbles appear","A rolling boil for at least 1 minute","10 seconds","Just warm it up"],x:"Bring it to a full rolling boil for 1 minute (3 minutes at high altitude). Let it cool before drinking."},

 {en:{q:"No fuel left to boil. You have 6% bleach. The water was cloudy but is now filtered. How many drops per gallon?",o:["2 drops","8 drops","16 drops","A full cup"],x:"EPA: 8 drops of 6% bleach per gallon of clear water. Double it, to 16 drops, if the water is still cloudy, colored, or very cold."},
  ht:{q:"Pa gen gaz ankò pou bouyi. Ou gen klowòks 6%. Dlo a te twoub men ou filtre l kounye a. Konbyen gout pa galon?",o:["2 gout","8 gout","16 gout","Yon tas plen"],x:"EPA: 8 gout klowòks 6% pou chak galon dlo klè. Double l, 16 gout, si dlo a toujou twoub, gen koulè, oswa li frèt anpil."},a:2},

 {en:{q:"Flood water got into the tank and it smells like gasoline. Boil or bleach it?",o:["Boil it longer","Double the bleach","Neither. Don't drink it. Use stored water and call your local health department."],x:"Boiling and bleach kill germs but do NOT remove fuel, metals or other chemicals. This is when you get outside help."},

 {en:{q:"Day 20. Water is running low. What's the safe move?",o:["Cut everyone to one cup a day","Drink what you need today, and look for safe water and outside help now","Give it all to the adults"],x:"FEMA: never ration water. Drink what you need today, and start finding more safe water or help, including evacuation if officials call for it."},

const CHECK={
 en:["Store 1 gallon per person per day: at least 3 days to start, 2 weeks or more as your goal","Use sealed bottled water or food-grade containers. No milk jugs, no chemical buckets","Label each container “DRINKING WATER” with the date","Replace water you bottled yourself every 6 months","Keep water in a cool, dark place away from fuel and chemicals","Plain unscented bleach (6–8.25%) and an eyedropper","Clean cloths or coffee filters for cloudy water","A pot and a SAFE way to boil water (never a grill indoors)","Remember: boiling and bleach don't remove chemicals. Follow local health officials."],

};

let st={screen:"intro",i:0,picked:null,sc:{sort:0,store:0,calc:0,emerg:0}};
const app=document.getElementById('app');
const t=k=>UI[L][k];

function setLang(l){L=l;try{localStorage.setItem('bunkerLang',l)}catch(e){}
  document.documentElement.lang=l==='ht'?'ht':'en';
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));render()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));

const ORDER=["intro","sort","store","calc","emerg","results"];
function prog(){const n=ORDER.indexOf(st.screen);
  document.getElementById('prog').innerHTML=ORDER.slice(1).map((s,k)=>`<div class="${k+1<n?'done':k+1===n?'now':''}"></div>`).join('')}

function render(){prog();
 const s=st.screen;
 if(s==="intro")return intro();
 if(s==="sort")return sort();
 if(s==="results")return results();
 return quiz(s);}

function intro(){app.innerHTML=`<div class="card">
  <div class="stage">${t('room')}</div><div class="hero">💧</div>
  <h1>${t('title')}</h1><p>${t('intro1')}</p><p>${t('intro2')}</p>
  <button class="btn" id="go">${t('start')}</button></div>
  <p class="note">${t('proto')}</p>`;
 document.getElementById('go').onclick=()=>{st.screen="sort";st.i=0;st.picked=null;render()}}

function fbHTML(ok,x){return `<div class="fb ${ok?'':'no'}"><strong>${ok?'✅ '+t('right'):'❌ '+t('wrong')}</strong><p>${x}</p></div>`}

function sort(){const it=ITEMS[st.i],d=it[L];const p=st.picked;
 const bins=[["u","✅",t('use')],["s","➖",t('skip')],["a","⚠️",t('avoid')]];
 app.innerHTML=`<div class="card"><div class="stage">${t('s1')}</div><h2>${t('s1t')}</h2>
  <div class="count">${st.i+1} ${t('of')} ${ITEMS.length}</div>
  <div class="item"><div class="em">${it.e}</div><div class="nm">${d[0]}</div></div>
  <div class="bins">${bins.map(([k,ic,lb])=>`<button class="bin ${p?(k===it.b?'right':k===p?'wrong':''):''}" data-k="${k}" ${p?'disabled':''}><b>${ic}</b>${lb}</button>`).join('')}</div>
  ${p?fbHTML(p===it.b,d[1])+`<button class="btn" id="nx">${t('next')}</button>`:''}</div>`;
 if(!p)app.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{st.picked=b.dataset.k;if(st.picked===it.b)st.sc.sort++;render()});
 else document.getElementById('nx').onclick=()=>{st.picked=null;if(++st.i>=ITEMS.length){st.screen="store";st.i=0}render();window.scrollTo(0,0)}}

const QS={store:STORE,calc:CALC,emerg:EMERG};
const NEXT={store:"calc",calc:"emerg",emerg:"results"};
const LABEL={store:'s2',calc:'s3',emerg:'s4'};
function quiz(s){const set=QS[s],q=set[st.i],d=q[L],p=st.picked;
 const scene=s==="emerg"?`<div class="scene"><div class="tag">🌀 ${L==='ht'?'Siklòn':'Hurricane'}</div></div>`:'';
 app.innerHTML=`<div class="card"><div class="stage">${t(LABEL[s])}</div>${st.i===0?scene:''}
  <div class="count">${st.i+1} ${t('of')} ${set.length}</div><h2>${d.q}</h2>
  <div class="opts">${d.o.map((o,k)=>`<button class="opt ${p!==null?(k===q.a?'right':k===p?'wrong':''):''}" data-k="${k}" ${p!==null?'disabled':''}>${o}</button>`).join('')}</div>
  ${p!==null?fbHTML(p===q.a,d.x)+`<button class="btn" id="nx">${t('next')}</button>`:''}</div>`;
 if(p===null)app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.picked=+b.dataset.k;if(st.picked===q.a)st.sc[s]++;render()});
 else document.getElementById('nx').onclick=()=>{st.picked=null;if(++st.i>=set.length){st.screen=NEXT[s];st.i=0}render();window.scrollTo(0,0)}}

function results(){const c=st.sc;
 const cats=[["catSort",c.sort,ITEMS.length,.30],["catStore",c.store,STORE.length,.20],["catCalc",c.calc,CALC.length,.20],["catEmerg",c.emerg,EMERG.length,.30]];
 const total=Math.round(cats.reduce((a,[,s,n,w])=>a+s/n*w*100,0));
 const col=v=>v>=80?'var(--good)':v>=60?'var(--mid)':'var(--bad)';
 const lab=total>=80?t('readyHigh'):total>=60?t('readyMid'):t('readyLow');
 app.innerHTML=`<div class="card"><div class="stage">${t('results')}</div>
  <div class="score"><div class="big" style="color:${col(total)}">${total}<small>/100</small></div>
  <span class="badge" style="background:${col(total)};color:#111">${total>=80?'🏅 ':''}${lab}</span></div>
  ${cats.map(([k,s,n])=>{const v=Math.round(s/n*100);return `<div class="bar"><div class="row"><span>${t(k)}</span><span>${s}/${n}</span></div><div class="track"><div class="fill" style="width:0;background:${col(v)}" data-w="${v}"></div></div></div>`}).join('')}
  </div>
  <div class="card" style="margin-top:14px"><h2>📋 ${t('checklist')}</h2><p>${t('checkSub')}</p>
  <ul class="check">${CHECK[L].map(x=>`<li>${x}</li>`).join('')}</ul>
  <button class="btn ghost" id="cp">${t('copy')}</button>
  <button class="btn" id="ag">${t('again')}</button>
  <div class="src">${t('sources')}<br>
   <a href="https://www.epa.gov/ground-water-and-drinking-water/emergency-disinfection-drinking-water" target="_blank" rel="noopener">EPA · Emergency Disinfection of Drinking Water</a><br>
   <a href="https://www.ready.gov/water" target="_blank" rel="noopener">Ready.gov (FEMA) · Water</a></div></div>
  <p class="note">${t('proto')}</p>`;
 requestAnimationFrame(()=>setTimeout(()=>app.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%'),50));
 document.getElementById('cp').onclick=async e=>{const txt=`THE BUNKER — ${t('checklist')}\n`+CHECK[L].map(x=>'☐ '+x).join('\n');
  try{await navigator.clipboard.writeText(txt);e.target.textContent=t('copied')}catch(err){e.target.textContent='—'}};
 document.getElementById('ag').onclick=()=>{st={screen:"intro",i:0,picked:null,sc:{sort:0,store:0,calc:0,emerg:0}};render();window.scrollTo(0,0)};}

setLang(L);
</script>
</body>
</html>
