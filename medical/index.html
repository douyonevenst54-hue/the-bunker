 stages:[

   {en:{q:"Where should the family first aid kit be kept?",o:["In one easy-to-reach spot that everyone in the family knows","Locked in the attic so kids can't reach it","Only in the car","Split up in different drawers around the house"],x:"In an emergency nobody has time to search. One known, reachable spot. Keep medicines themselves out of children's reach."},

   {en:{q:"What should the written medication list include for each person?",o:["Just the color of the pills","Name of each medicine, the dose, allergies, and the doctor or pharmacy","Only the most expensive medicines"],x:"If someone is hurt or confused, this list lets a responder or a new doctor continue treatment safely. Keep a copy in the kit and one on your phone."},

  {key:"triage",w:.2,label:{en:"Stage 3 · Recognize",ht:"Etap 3 · Rekonèt"},cat:{en:"Recognizing emergencies",ht:"Rekonèt ijans"},qs:[

    ht:{q:"Twa moun bezwen èd. Kilès ki bezwen 911 kounye a menm?",o:["Yon timoun ki kale jenou l","Yon nonm ki gen doulè nan pwatrin, k ap swe, ki manke souf","Yon adolesan ki gen yon ti kout solèy"],x:"Doulè nan pwatrin ak swe oswa souf kout ka yon atak kè. Rele 911 touswit. Lòt yo, ou ka okipe yo ak premye swen."},a:1},
   {en:{q:"Someone collapses. They don't respond and aren't breathing normally. What do you do first?",o:["Give them water","Call 911 (on speaker) and start hands-only CPR right away","Wait a few minutes to see if they wake up","Lay them down and go look for a doctor"],x:"Every minute without CPR lowers the chance of survival. Call 911, put the phone on speaker, and start pushing on the chest."},

   {en:{q:"Blood soaks through the gauze. Now what?",o:["Pull the gauze off to look","Add more gauze on top and keep pressing","Stop pressing so blood can flow"],x:"Removing soaked gauze pulls away the clot that is forming. Add layers and keep steady pressure."},

   {en:{q:"His last tetanus shot was 7 years ago. Does this dirty wound matter?",o:["No, tetanus shots last forever","Yes. For a dirty or puncture wound, get a booster if it's been 5 or more years","Only if the wound is bigger than a hand"],x:"CDC guidance: adults need a booster every 10 years, but a dirty or puncture wound needs one if it has been 5 or more years. Being in flood water alone does not require a shot."},

   {en:{q:"Your aunt burns her hand on a hot pot while cooking. What do you do?",o:["Put ice directly on it","Spread butter on it","Hold it under cool, clean running water for 10–20 minutes","Pop the blisters"],x:"Red Cross: cool the burn with clean, cool running water as soon as possible. No ice, butter or grease. Get medical care for large or deep burns, or burns on the face, hands, feet or joints."},
    ht:{q:"Matant ou brile men l sou yon chodyè cho pandan l ap kwit manje. Kisa ou fè?",o:["Mete glas dirèkteman sou li","Fwote bè sou li","Kenbe l anba dlo pwòp ki fre k ap koule pandan 10–20 minit","Pete zanpoud yo"],x:"Lakwa Wouj: refwadi brili a ak dlo pwòp, fre, k ap koule, pi vit posib. Pa glas, pa bè, pa grès. Al chèche swen medikal pou gwo brili, brili fon, oswa brili sou figi, men, pye oswa jwenti."},a:2},
   {en:{q:"That night the power is out and the generator runs in the garage with the door open. Everyone has a headache, dizziness and nausea. What do you do?",o:["Take headache pills and go to sleep","Open one window and stay inside","Get everyone outside into fresh air right away and call 911"],x:"This is carbon monoxide poisoning. You can't see or smell it, and it kills people in their sleep. CDC: never run a generator indoors or in a garage, even with the door open. Keep it outside, at least 20 feet from windows, doors and vents."},
